name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install coverage
        run: python -m pip install coverage

      - name: Run unit tests with branch coverage
        run: |
          python -m coverage run --branch --source=. -m unittest discover -s . -p 'test_*.py' -v
          python -m coverage report --include='cache_core.py,cache_proxy.py' --fail-under=100

      - name: Compile Python modules
        run: python -m py_compile cache_core.py cache_proxy.py
